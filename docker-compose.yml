services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-development-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      DB_ENGINE: mysql
      MYSQL_DATABASE: finsight
      MYSQL_USER: finsight
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finsight-local-only}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      REDIS_URL: redis://cache:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 8s
      retries: 3
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: finsight
      MYSQL_USER: finsight
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finsight-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
  cache:
    image: redis:7-alpine
volumes:
  mysql_data:
